<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Temple Street ERP - Biometric Kiosk</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">

  <!-- face-api.js Core Models -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <!-- 🚀 GreenSock (GSAP v3) Animation Engine -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    :root {
      --brand-red: #dc2626;
      --brand-dark: #090d16;
      --brand-surface: #111827;
      --hud-cyan: #38bdf8;
      --accent-emerald: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--brand-dark);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }

    .kiosk-card {
      width: 100%;
      max-width: 440px;
      background: var(--brand-surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* Biometric Camera Viewport */
    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      margin: 14px auto 16px;
      border: 3px solid #334155;
      border-radius: 20px;
      overflow: hidden;
      background: #000000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    /* Top HUD Pills */
    .status-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      z-index: 20;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .bg-gps-active {
      background: rgba(16, 185, 129, 0.85);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .bg-gps-offline {
      background: rgba(100, 116, 139, 0.85);
      color: #ffffff;
    }

    /* Scanning Radar Line Overlay */
    .scan-radar-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--hud-cyan) 50%, transparent 100%);
      box-shadow: 0 0 15px var(--hud-cyan);
      opacity: 0;
      z-index: 15;
      pointer-events: none;
    }

    /* Verified Staff Stamp */
    .verified-badge {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-punch {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      padding: 14px 20px;
      width: 100%;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.3);
      transition: all 0.2s;
    }

    .btn-punch:hover:not(:disabled) {
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(2, 132, 199, 0.4);
    }

    .btn-punch:disabled {
      background: #1e293b;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .form-control, .form-select {
      background-color: #0f172a !important;
      border: 1.5px solid #334155;
      color: #f8fafc !important;
      font-weight: 700;
      font-size: 14px;
      border-radius: 12px;
      padding: 11px 14px;
      transition: border-color 0.2s;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--hud-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .feed-pill {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <div class="kiosk-card" id="kioskContainer">
    
    <!-- Top Branding & Status Indicator -->
    <div class="d-flex align-items-center justify-content-between mb-2 px-1">
      <div class="text-start">
        <h5 class="fw-bold mb-0 text-white tracking-tight">TEMPLE STREET</h5>
        <span class="text-secondary small font-monospace" style="font-size: 10px;">FACIAL ATTENDANCE KIOSK</span>
      </div>
      <span class="badge rounded-pill bg-dark border border-secondary text-secondary" style="font-size: 10px;">
        <i class="bi bi-cpu me-1 text-info"></i>AI 0.48
      </span>
    </div>

    <!-- Active Detection & Greeting Container -->
    <div id="detectingBox" class="my-2" style="min-height: 38px;"></div>

    <!-- Camera Viewport with Scanner Overlay -->
    <div class="camera-wrap" id="cameraFrame">
      <div id="gpsPill" class="status-pill bg-gps-offline">GPS: OFFLINE</div>
      <div id="scanLine" class="scan-radar-line"></div>
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- System Status Bar -->
    <div id="aiMsg" class="alert alert-dark py-2 px-3 small mb-3 border-secondary-subtle text-secondary font-monospace" style="font-size: 11px;">
      ⏳ Initializing Neural Face Engine...
    </div>

    <!-- Store Location Selector -->
    <select id="outlet" class="form-select mb-2 text-center">
      <option value="Ashok Nagar">Ashok Nagar</option>
      <option value="ORN">ORN</option>
      <option value="Naraina">Naraina</option>
    </select>

    <!-- Manual ID Fallback Input -->
    <input type="text" id="empID" class="form-control text-center mb-3 font-monospace"
           placeholder="SCAN FACE OR TYPE ID"
           oninput="this.value = this.value.toUpperCase();"
           style="border: 1.5px solid #475569; letter-spacing: 1px;">

    <!-- Manual Punch Trigger Button -->
    <button id="punchBtn" class="btn btn-punch" onclick="handleAttendance()" disabled>
      RECORD ATTENDANCE
    </button>

    <!-- Real-time Feedback & Result Bar -->
    <div id="feedback" class="mt-3" style="min-height: 32px;"></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    let userPos = { lat: 0, lng: 0 };
    let isIdentifying = false;
    let scanAnimation = null;

    // 🚀 NAYA: Apps Script se Active Outlets dynamically load karna
async function loadDynamicOutlets() {
  try {
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "GET_ACTIVE_OUTLETS" })
    });
    
    const resData = await response.json();
    if (resData && resData.status === "SUCCESS" && Array.isArray(resData.outlets) && resData.outlets.length > 0) {
      const outletSelect = document.getElementById('outlet');
      const currentSelected = outletSelect.value;
      
      // Dropdown ko nayi active branches se update karein
      outletSelect.innerHTML = "";
      resData.outlets.forEach(outName => {
        const opt = document.createElement("option");
        opt.value = outName;
        opt.textContent = outName;
        outletSelect.appendChild(opt);
      });
      
      // Agar pehle se koi selected tha aur wo nayi list mein bhi hai, toh wahi select rakhein
      if (resData.outlets.includes(currentSelected)) {
        outletSelect.value = currentSelected;
      }
      console.log("✅ Outlets successfully synced:", resData.outlets);
    }
  } catch (err) {
    console.warn("⚠️ Dynamic outlet fetch failed, keeping fallback list:", err);
  }
}

window.onload = async () => {
  // 🏢 Background mein dynamic outlets fetch karein (bina screen freeze kiye)
  loadDynamicOutlets();

  // 🚀 Entrance GSAP Transition for the Kiosk Card
  gsap.from("#kioskContainer", { y: 25, opacity: 0, duration: 0.6, ease: "power2.out" });

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;

    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);

    document.getElementById('aiMsg').innerText = "✅ AI Ready | Verifying GPS...";
    document.getElementById('punchBtn').disabled = false;

    startTracking();
    startGps();
    startAutoIdentification();
  } catch (e) {
    document.getElementById('aiMsg').innerText = "❌ Camera Access Denied: " + e.message;
  }
};

    function startTracking() {
      const displaySize = { width: video.videoWidth || 400, height: video.videoHeight || 300 };
      faceapi.matchDimensions(overlay, displaySize);

      setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
        const resized = faceapi.resizeResults(detections, displaySize);
        overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
        faceapi.draw.drawDetections(overlay, resized);

        // 🚀 GSAP Scanning Radar Trigger: Runs when face is present in camera
        if (detections.length > 0 && !scanAnimation) {
          triggerScanningRadar(true);
        } else if (detections.length === 0 && scanAnimation) {
          triggerScanningRadar(false);
        }
      }, 100);
    }

    // 🚀 Biometric Pulse / Radar Line Animation via GSAP
    function triggerScanningRadar(active) {
      const scanLine = document.getElementById('scanLine');
      const cameraFrame = document.getElementById('cameraFrame');

      if (active) {
        gsap.to(cameraFrame, { borderColor: "#0ea5e9", duration: 0.4 });
        gsap.set(scanLine, { opacity: 0.8, top: "0%" });
        scanAnimation = gsap.to(scanLine, {
          top: "95%",
          duration: 1.4,
          repeat: -1,
          yoyo: true,
          ease: "power1.inOut"
        });
      } else {
        if (scanAnimation) {
          scanAnimation.kill();
          scanAnimation = null;
        }
        gsap.to(scanLine, { opacity: 0, duration: 0.3 });
        gsap.to(cameraFrame, { borderColor: "#334155", duration: 0.4 });
      }
    }

    function startAutoIdentification() {
  setInterval(async () => {
    // Agar HR ne ID type kar rakhi hai ya box focus me hai, toh auto-match pause rahega
    if (isIdentifying || document.activeElement.id === 'empID') return;
    if (document.getElementById('empID').value !== "") return;

    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (detection) {
      isIdentifying = true;
      document.getElementById('detectingBox').innerHTML = "<span class='text-warning small fw-bold font-monospace'>🔍 RECOGNIZING FACE...</span>";

      try {
        // Webhook ke zariye face identify karein (CORS Safe)
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "IDENTIFY_FACE",
            payload: { descriptor: Array.from(detection.descriptor) }
          })
        });

        const resData = await response.json();
        const res = (resData && resData.status === "SUCCESS") ? resData.result : null;

        if (res && res.id) {
          // 1. Staff pehchan liya gaya -> ID fill karein
          document.getElementById('empID').value = res.id;
          document.getElementById('empID').readOnly = true;

          // Branch dropdown auto-sync karein agar mapped hai
          if (res.outlet) {
            const outSelect = document.getElementById('outlet');
            for (let i = 0; i < outSelect.options.length; i++) {
              if (outSelect.options[i].value.toLowerCase() === res.outlet.toLowerCase()) {
                outSelect.selectedIndex = i;
                break;
              }
            }
          }

          // Screen par badge dikhayein
          document.getElementById('detectingBox').innerHTML = `<span class='verified-badge'><i class='bi bi-check-circle-fill'></i> HI, ${res.name}</span>`;
          if (typeof gsap !== 'undefined') {
            gsap.from(".verified-badge", { scale: 0.4, opacity: 0, duration: 0.5, ease: "elastic.out(1.2, 0.5)" });
          }

          document.getElementById('aiMsg').className = "alert alert-success py-2 px-3 small mb-3 font-monospace";
          document.getElementById('aiMsg').innerHTML = `<b>Verified:</b> ${res.name} (${res.id})`;

          // 🚀 AUTO-PUNCH: Bina button dabaye 1.4 sec mein attendance punch
          setTimeout(() => { handleAttendance(); }, 1400);

        } else {
          // Unregistered/Pending face
          document.getElementById('detectingBox').innerHTML = "<span class='text-danger small fw-bold font-monospace'>❓ UNKNOWN FACE</span>";
          document.getElementById('empID').readOnly = false;
          setTimeout(() => {
            if (document.getElementById('empID').value === "") {
              document.getElementById('detectingBox').innerHTML = "";
            }
            isIdentifying = false;
          }, 2000);
        }
      } catch (err) {
        console.error("Identification Error:", err);
        document.getElementById('detectingBox').innerHTML = "";
        isIdentifying = false;
      }
    }
  }, 2500);
}

    function startGps() {
      navigator.geolocation.watchPosition(pos => {
        userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const gpsPill = document.getElementById('gpsPill');
        gpsPill.className = "status-pill bg-gps-active";
        gpsPill.innerText = "GPS: ACTIVE";

        // Subtle GSAP glow pulse when GPS locks
        gsap.fromTo(gpsPill, { scale: 0.9 }, { scale: 1, duration: 0.4, ease: "back.out(2)" });

        let aiMsgBox = document.getElementById('aiMsg');
        if (aiMsgBox.innerText.includes("Verifying GPS")) {
          aiMsgBox.innerText = "✅ AI & GPS Ready | Please Scan Face";
        }
      }, null, { enableHighAccuracy: true });
    }

   // ==============================================================
// 🚀 GITHUB-TO-APPS-SCRIPT ATTENDANCE & AUTO-CAPTURE ENGINE
// ==============================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby61EwqCDFvrKfoF1phHoqABK1EqAEd0fQwaKBmkz0KENArmLqYQjz9oU-LvqG4Rw/exec";

async function handleAttendance() {
  const empInput = document.getElementById('empID');
  const id = empInput.value.trim().toUpperCase();
  const feedback = document.getElementById('feedback');
  const punchBtn = document.getElementById('punchBtn');

  if (!id) return alert("Please show your face or enter ID manually");

  punchBtn.disabled = true;
  feedback.innerHTML = "<span class='feed-pill bg-secondary text-white'>⏳ Recording Punch...</span>";

  try {
    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 }))
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (!detection) {
      alert("Face lost! Please stay centered in camera.");
      punchBtn.disabled = false;
      feedback.innerText = "";
      return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);

    if (typeof gsap !== 'undefined') {
      gsap.to("#punchBtn", { scale: 0.96, duration: 0.1, yoyo: true, repeat: 1 });
    }

    const payloadData = {
      action: "PUNCH_ATTENDANCE",
      payload: {
        empID: id,
        outlet: document.getElementById('outlet').value,
        lat: (typeof userPos !== 'undefined' && userPos && userPos.lat) ? userPos.lat : 28.6370,
        lng: (typeof userPos !== 'undefined' && userPos && userPos.lng) ? userPos.lng : 77.1380,
        faceDescriptor: Array.from(detection.descriptor),
        photo: canvas.toDataURL('image/jpeg', 0.5)
      }
    };

    // 🚀 CORS-Safe & 302 Redirect Following Webhook
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payloadData)
    });

    const resJson = await response.json();
    punchBtn.disabled = false;
    let res = String(resJson.status || "");

    let isSuccess = res.includes("SUCCESS") || res.includes("Recorded") || res.includes("Punch");
    let isAlready = res.includes("⚠️") || res.includes("ALREADY");
    let isNewCapture = res.includes("NAYA CHEHRA") || res.includes("CAPTURE");

    if (isSuccess) {
      let isPunchOut = res.includes("Punch Out");
      let pillStyle = isPunchOut 
        ? "background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: 1px solid #818cf8;" 
        : "background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: white; border: 1px solid #34d399;";

      feedback.innerHTML = `<span class='feed-pill' style='${pillStyle}'>${res}</span>`;
      if (typeof gsap !== 'undefined') {
        gsap.from("#feedback .feed-pill", { y: 15, scale: 0.9, opacity: 0, duration: 0.45, ease: "back.out(1.5)" });
      }
      setTimeout(() => { if (typeof resetScannerUI === 'function') resetScannerUI(); }, 3500);

    } else if (isNewCapture) {
      feedback.innerHTML = `<span class='feed-pill bg-warning text-dark shadow-lg'>${res}</span>`;
      alert(res + "\n\nAb HR Portal par jakar 'Staff Management' me is photo ko Approve karein.");
      setTimeout(() => { if (typeof resetScannerUI === 'function') resetScannerUI(); }, 4000);

    } else if (isAlready) {
      feedback.innerHTML = `<span class='feed-pill bg-warning text-dark'>${res}</span>`;
      if (typeof gsap !== 'undefined') {
        gsap.fromTo("#feedback .feed-pill", { x: -8 }, { x: 8, duration: 0.1, repeat: 3, yoyo: true });
      }
      setTimeout(() => { if (typeof resetScannerUI === 'function') resetScannerUI(); }, 3500);

    } else {
      feedback.innerHTML = `<span class='feed-pill bg-danger text-white'>${res}</span>`;
      alert(res);
      setTimeout(() => { if (typeof resetScannerUI === 'function') resetScannerUI(); }, 3500);
    }

  } catch (err) {
    punchBtn.disabled = false;
    feedback.innerHTML = `<span class='feed-pill bg-danger text-white'>Error: ${err.message}</span>`;
    alert("Connection Error: " + err.message);
  }
}

    function resetScannerUI() {
      document.getElementById('empID').value = "";
      document.getElementById('empID').readOnly = false;
      document.getElementById('detectingBox').innerHTML = "";
      document.getElementById('feedback').innerHTML = "";
      document.getElementById('aiMsg').className = "alert alert-dark py-2 px-3 small mb-3 border-secondary-subtle text-secondary font-monospace";
      document.getElementById('aiMsg').innerText = "✅ AI Ready | Next Staff Please";
      triggerScanningRadar(false);
      isIdentifying = false;
    }
    // 🚀 NAYA: Apps Script se Active Outlets dynamically load karna
async function loadDynamicOutlets() {
  try {
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "GET_ACTIVE_OUTLETS" })
    });
    
    const resData = await response.json();
    if (resData && resData.status === "SUCCESS" && Array.isArray(resData.outlets) && resData.outlets.length > 0) {
      const outletSelect = document.getElementById('outlet');
      const currentSelected = outletSelect.value;
      
      // Dropdown ko nayi list se update karein
      outletSelect.innerHTML = "";
      resData.outlets.forEach(outName => {
        const opt = document.createElement("option");
        opt.value = outName;
        opt.textContent = outName;
        outletSelect.appendChild(opt);
      });
      
      // Agar pehle se koi selected tha jo abhi bhi list mein hai, toh usko select rakhein
      if (resData.outlets.includes(currentSelected)) {
        outletSelect.value = currentSelected;
      }
      console.log("✅ Outlets successfully synced:", resData.outlets);
    }
  } catch (err) {
    console.warn("⚠️ Dynamic outlet fetch failed, using fallback:", err);
  }
}
  </script>
</body>
</html>
