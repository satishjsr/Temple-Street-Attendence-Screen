<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temple Street ERP</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #f1f5f9; 
        }
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <iframe id="erpFrame" allow="camera *; geolocation *; microphone *; autoplay *"></iframe>
    
    <script>
        // Aapka Google Script ka Main Link
        const scriptUrl = "https://script.google.com/macros/s/AKfycby61EwqCDFvrKfoF1phHoqABK1EqAEd0fQwaKBmkz0KENArmLqYQjz9oU-LvqG4Rw/exec";
        
        // Link ke aage jo bhi likha ho (jaise ?mode=admin), use pakadna
        const queryString = window.location.search;
        
        // Iframe ko sahi link par bhejna
        document.getElementById("erpFrame").src = scriptUrl + queryString;
    </script>
</body>
</html>
