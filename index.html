<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Temple Street ERP - Biometric Kiosk</title>

  <!-- Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">

  <!-- face-api.js Core -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <!-- 🚀 GreenSock (GSAP v3) Animation Engine -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    :root {
      --brand-dark: #090d16;
      --brand-surface: #111827;
      --hud-cyan: #38bdf8;
      --accent-emerald: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--brand-dark);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }

    .kiosk-card {
      width: 100%;
      max-width: 440px;
      background: var(--brand-surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* Biometric Camera Viewport */
    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      margin: 14px auto 16px;
      border: 3px solid #334155;
      border-radius: 20px;
      overflow: hidden;
      background: #000000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    /* Top HUD Pills */
    .status-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      z-index: 20;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .bg-gps-active {
      background: rgba(16, 185, 129, 0.85);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .bg-gps-offline {
      background: rgba(100, 116, 139, 0.85);
      color: #ffffff;
    }

    /* Scanning Radar Line Overlay */
    .scan-radar-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--hud-cyan) 50%, transparent 100%);
      box-shadow: 0 0 15px var(--hud-cyan);
      opacity: 0;
      z-index: 15;
      pointer-events: none;
    }

    /* Verified Staff Stamp */
    .verified-badge {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-punch {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      padding: 14px 20px;
      width: 100%;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.3);
      transition: all 0.2s;
    }

    .btn-punch:hover:not(:disabled) {
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(2, 132, 199, 0.4);
    }

    .btn-punch:disabled {
      background: #1e293b;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .form-control, .form-select {
      background-color: #0f172a !important;
      border: 1.5px solid #334155;
      color: #f8fafc !important;
      font-weight: 700;
      font-size: 14px;
      border-radius: 12px;
      padding: 11px 14px;
      transition: border-color 0.2s;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--hud-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .feed-pill {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <div class="kiosk-card" id="kioskContainer">
    
    <!-- Top Branding & Status Indicator -->
    <div class="d-flex align-items-center justify-content-between mb-2 px-1">
      <div class="text-start">
        <h5 class="fw-bold mb-0 text-white tracking-tight">TEMPLE STREET</h5>
        <span class="text-secondary small font-monospace" style="font-size: 10px;">SMART FACIAL ATTENDANCE KIOSK</span>
      </div>
      <span class="badge rounded-pill bg-dark border border-secondary text-secondary" style="font-size: 10px;">
        <i class="bi bi-cpu me-1 text-info"></i>AI 0.48
      </span>
    </div>

    <!-- Active Detection & Greeting Container -->
    <div id="detectingBox" class="my-2" style="min-height: 38px;"></div>

    <!-- Camera Viewport with Scanner Overlay -->
    <div class="camera-wrap" id="cameraFrame">
      <div id="gpsPill" class="status-pill bg-gps-offline">GPS: OFFLINE</div>
      <div id="scanLine" class="scan-radar-line"></div>
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <!-- System Status Bar -->
    <div id="aiMsg" class="alert alert-dark py-2 px-3 small mb-3 border-secondary-subtle text-secondary font-monospace" style="font-size: 11px;">
      ⏳ Connecting to Database...
    </div>

    <!-- Store Location Selector -->
    <select id="outlet" class="form-select mb-2 text-center">
      <option value="Ashok Nagar">Ashok Nagar</option>
      <option value="ORN">ORN</option>
      <option value="Naraina">Naraina</option>
    </select>

    <!-- Manual ID Fallback Input -->
    <div class="d-flex gap-2 mb-3">
      <input type="text" id="empID" class="form-control text-center font-monospace"
             placeholder="SHOW FACE OR ENTER ID"
             oninput="this.value = this.value.toUpperCase();"
             style="border: 1.5px solid #475569; letter-spacing: 1px;">
      <button class="btn btn-secondary px-3" onclick="resetScanner()" style="border-radius: 12px; font-weight: bold; background: #334155; border: none;">✕</button>
    </div>

    <!-- Manual Punch Trigger Button -->
    <button id="punchBtn" class="btn btn-punch" onclick="handleAttendance()" disabled>
      RECORD ATTENDANCE
    </button>

    <!-- Real-time Feedback & Result Bar -->
    <div id="feedback" class="mt-3" style="min-height: 32px;"></div>
  </div>

  <!-- 🔥 MODULAR FIREBASE CLIENT SDK (LOCAL MEMORY CACHE) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://temple-street-erp-default-rtdb.firebaseio.com/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.firebaseDb = db;

    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        console.log("🔥 Firebase connected!");
      } else {
        document.getElementById('aiMsg').innerText = "⚠️ Network issue, retrying connection...";
      }
    });

    onValue(ref(db, 'staff'), (snapshot) => {
      try {
        const data = snapshot.val();
        if (!data) {
          document.getElementById('aiMsg').innerText = "⚠️ DB is empty. Run sync script in backend.";
          return;
        }

        const labeledDescriptors = [];
        window.staffMap = {};
        let validFacesCount = 0;

        for (let empId in data) {
          if (data[empId].faceCode) {
            window.staffMap[empId] = { name: data[empId].name || "Staff", outlet: data[empId].outlet || "" };
            let rawCode = data[empId].faceCode;
            let floatArr;
            try {
              if (typeof rawCode === 'string') floatArr = new Float32Array(JSON.parse(rawCode));
              else if (Array.isArray(rawCode)) floatArr = new Float32Array(rawCode);
              else floatArr = new Float32Array(Object.values(rawCode));

              if (floatArr.length === 128) {
                labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(empId, [floatArr]));
                validFacesCount++;
              }
            } catch(e) {}
          }
        }

        if (labeledDescriptors.length > 0) {
          window.faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.48);
          const aiMsg = document.getElementById('aiMsg');
          aiMsg.className = "alert alert-success py-2 px-3 small mb-3 font-monospace";
          aiMsg.innerHTML = `✅ DB Ready (${validFacesCount} faces) | AI Active`;
        }
      } catch (err) {}
    });

    window.recordInstantPunch = (id) => {
      const today = new Date().toISOString().split('T')[0];
      set(ref(db, `punches/${today}/${id}`), { time: new Date().toLocaleTimeString("en-IN"), status: "P" });
    };

    window.registerNewFaceToFirebase = (id, descriptor, outlet) => {
      set(ref(db, `staff/${id}/faceCode`), Array.from(descriptor));
      set(ref(db, `staff/${id}/outlet`), outlet);
    };
  </script>

  <!-- 🚀 MAIN CLIENT-SIDE LOGIC WITH GSAP ANIMATIONS -->
  <script>
    // 🔥 YOUR APPS SCRIPT WEB APP DEPLOYMENT URL
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycby61EwqCDFvrKfoF1phHoqABK1EqAEd0fQwaKBmkz0KENArmLqYQjz9oU-LvqG4Rw/exec";

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    let userPos = { lat: 0, lng: 0 };
    let isIdentifying = false;
    let punchTimer;
    let lastDetectedMood = "😐";
    let scanAnimation = null;

    window.onload = async () => {
      // 🚀 GSAP Kiosk Card Entrance Animation
      gsap.from("#kioskContainer", { y: 25, opacity: 0, duration: 0.6, ease: "power2.out" });

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.onloadedmetadata = () => { video.play(); };

        document.getElementById('aiMsg').innerText = "⏳ Loading AI Engine...";

        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
          faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
        ]);

        document.getElementById('punchBtn').disabled = false;

        startTracking();
        startGps();
        startAutoIdentification();
      } catch (e) {
        document.getElementById('aiMsg').innerHTML = "❌ <b>Camera Access Denied.</b> Please allow permissions.";
      }
    };

    window.resetScanner = () => {
      if (punchTimer) clearTimeout(punchTimer);
      document.getElementById('empID').value = "";
      document.getElementById('empID').readOnly = false;
      document.getElementById('detectingBox').innerHTML = "";
      document.getElementById('feedback').innerHTML = "";
      triggerScanningRadar(false);
      isIdentifying = false;
    };

    function startTracking() {
      const displaySize = { width: video.videoWidth || 400, height: video.videoHeight || 300 };
      faceapi.matchDimensions(overlay, displaySize);

      setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
        const resized = faceapi.resizeResults(detections, displaySize);
        overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
        faceapi.draw.drawDetections(overlay, resized);

        // 🚀 GSAP Scanning Radar Trigger: When a face enters the camera frame
        if (detections.length > 0 && !scanAnimation) {
          triggerScanningRadar(true);
        } else if (detections.length === 0 && scanAnimation) {
          triggerScanningRadar(false);
        }
      }, 100);
    }

    // 🚀 Biometric Pulse / Radar Line Animation via GSAP
    function triggerScanningRadar(active) {
      const scanLine = document.getElementById('scanLine');
      const cameraFrame = document.getElementById('cameraFrame');

      if (active) {
        gsap.to(cameraFrame, { borderColor: "#0ea5e9", duration: 0.4 });
        gsap.set(scanLine, { opacity: 0.8, top: "0%" });
        scanAnimation = gsap.to(scanLine, {
          top: "95%",
          duration: 1.4,
          repeat: -1,
          yoyo: true,
          ease: "power1.inOut"
        });
      } else {
        if (scanAnimation) {
          scanAnimation.kill();
          scanAnimation = null;
        }
        gsap.to(scanLine, { opacity: 0, duration: 0.3 });
        gsap.to(cameraFrame, { borderColor: "#334155", duration: 0.4 });
      }
    }

    function startAutoIdentification() {
      setInterval(async () => {
        if (isIdentifying) return;

        try {
          const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceExpressions()
            .withFaceDescriptor();

          if (detection) {
            if (document.activeElement.id === 'empID') return;
            if (document.getElementById('empID').value !== "") return;

            isIdentifying = true;
            document.getElementById('detectingBox').innerHTML = "🔍 <span class='text-warning font-monospace small font-bold'>SCANNING FACE...</span>";
            document.getElementById('feedback').innerHTML = "";

            if (window.faceMatcher) {
              const result = window.faceMatcher.findBestMatch(detection.descriptor);

              if (result.label !== 'unknown' && result.distance <= 0.48) {
                const empId = result.label;
                const info = window.staffMap[empId] || { name: "", outlet: "" };

                let moodEmoji = "😐 NORMAL";
                if (detection.expressions) {
                  const exps = detection.expressions;
                  const dominant = Object.keys(exps).reduce((a, b) => exps[a] > exps[b] ? a : b);
                  const moodMap = { happy: "😊 HAPPY", neutral: "😐 NORMAL", sad: "😔 SAD", angry: "😠 ANGRY", fearful: "😨 FEARFUL", disgusted: "🤢 DISGUST", surprised: "😲 WOW" };
                  moodEmoji = moodMap[dominant] || "😐 NORMAL";
                  lastDetectedMood = moodMap[dominant] ? moodMap[dominant].split(" ")[0] : "😐";
                }

                document.getElementById('empID').value = empId;
                document.getElementById('empID').readOnly = true;

                // 🚀 GSAP Elastic Pop Stamp for Verified Staff
                document.getElementById('detectingBox').innerHTML = `✅ <span class='verified-badge'><i class='bi bi-check-circle-fill'></i> HI, ${info.name} | ${moodEmoji}</span>`;
                gsap.from(".verified-badge", { scale: 0.4, opacity: 0, duration: 0.5, ease: "elastic.out(1.2, 0.5)" });

                punchTimer = setTimeout(() => { handleAttendance(); }, 1400);
              } else {
                document.getElementById('detectingBox').innerHTML = "❓ <span class='text-danger font-monospace small font-bold'>NOT RECOGNIZED</span>";
                isIdentifying = false;
              }
            } else {
              document.getElementById('detectingBox').innerHTML = "⏳ <span class='text-warning font-monospace small'>WAITING FOR DB...</span>";
              isIdentifying = false;
            }
          } else {
            const detectingText = document.getElementById('detectingBox').innerText;
            const isAIControlled = document.getElementById('empID').readOnly;
            const isNotPunching = !document.getElementById('punchBtn').disabled;

            if (detectingText.includes("NOT RECOGNIZED") || (isAIControlled && isNotPunching)) {
              window.resetScanner();
            }
          }
        } catch (err) {
          isIdentifying = false;
        }
      }, 1500);
    }

    function startGps() {
      navigator.geolocation.watchPosition(pos => {
        userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const gpsPill = document.getElementById('gpsPill');
        gpsPill.className = "status-pill bg-gps-active";
        gpsPill.innerText = "GPS: ACTIVE";
        gsap.fromTo(gpsPill, { scale: 0.9 }, { scale: 1, duration: 0.4, ease: "back.out(2)" });
      }, null, { enableHighAccuracy: true });
    }

    async function handleAttendance() {
      const id = document.getElementById('empID').value.trim().toUpperCase();
      if (!id) return alert("Please show your face or enter ID manually");

      document.getElementById('punchBtn').disabled = true;
      document.getElementById('feedback').innerHTML = "<span class='feed-pill bg-secondary text-white'>⏳ Recording Punch...</span>";

      const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (!detection) {
        document.getElementById('detectingBox').innerHTML = "<span class='text-danger small font-bold'>Face lost! Step back into frame.</span>";
        setTimeout(() => { window.resetScanner(); }, 2000);
        document.getElementById('punchBtn').disabled = false;
        document.getElementById('feedback').innerHTML = "";
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      // Tactile button bounce on punch
      gsap.to("#punchBtn", { scale: 0.96, duration: 0.1, yoyo: true, repeat: 1 });

      const payloadData = {
        empID: id,
        outlet: document.getElementById('outlet').value,
        lat: userPos.lat,
        lng: userPos.lng,
        faceDescriptor: Array.from(detection.descriptor),
        photo: canvas.toDataURL('image/jpeg', 0.5),
        mood: lastDetectedMood
      };

      fetch(GOOGLE_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "PUNCH_ATTENDANCE", payload: payloadData })
      })
      .then(response => response.json())
      .then(res => {
        document.getElementById('punchBtn').disabled = false;

        let msg = String(res.status || res || "");
        let isSuccess = msg.toUpperCase().includes("SUCCESS") || msg.includes("Recorded") || msg.includes("Punch");
        let isAlready = msg.includes("⚠️") || msg.toUpperCase().includes("ALREADY");

        if (isSuccess) {
          let isPunchOut = msg.includes("Punch Out");
          let pillStyle = isPunchOut
            ? "background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: 1px solid #818cf8;"
            : "background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: white; border: 1px solid #34d399;";

          document.getElementById('feedback').innerHTML = `<span class='feed-pill shadow-lg' style='${pillStyle}'>${msg}</span>`;
          gsap.from("#feedback .feed-pill", { y: 15, scale: 0.9, opacity: 0, duration: 0.45, ease: "back.out(1.5)" });

          if (window.recordInstantPunch) window.recordInstantPunch(id);
          if (window.registerNewFaceToFirebase && !window.staffMap[id]) {
            window.registerNewFaceToFirebase(id, detection.descriptor, document.getElementById('outlet').value);
          }

          setTimeout(() => {
            gsap.to("#feedback .feed-pill", { opacity: 0, y: -10, duration: 0.3, onComplete: window.resetScanner });
          }, 3500);

        } else if (isAlready) {
          document.getElementById('feedback').innerHTML = `<span class='feed-pill bg-warning text-dark border border-warning shadow'>${msg}</span>`;
          gsap.from("#feedback .feed-pill", { x: -8, duration: 0.1, repeat: 3, yoyo: true });
          setTimeout(() => { window.resetScanner(); }, 3500);

        } else {
          document.getElementById('feedback').innerHTML = `<span class='feed-pill bg-danger text-white border border-danger shadow'>${msg}</span>`;
          setTimeout(() => { window.resetScanner(); }, 3500);
        }
      })
      .catch(error => {
        document.getElementById('punchBtn').disabled = false;
        document.getElementById('feedback').innerHTML = `<span class='feed-pill bg-danger text-white border border-danger'>❌ Network Error, Try Again</span>`;
        setTimeout(() => { window.resetScanner(); }, 3000);
      });
    }
  </script>
</body>
</html>
